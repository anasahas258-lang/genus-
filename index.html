.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:14px;font-weight:700;font-size:.9rem;z-index:60;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.prog{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
@media(max-width:600px){
  .grid{grid-template-columns:1fr;gap:10px}
  .books{grid-template-columns:repeat(2,1fr);gap:10px}
  h1{font-size:1.2rem}
  main{padding:14px 12px 80px}
  .stats{grid-template-columns:repeat(2,1fr)}
}
</style>

<script>
const SB_URL='https://slomoffkmwbnrgwvezlh.supabase.co';
const SB_KEY='sb_publishable_Z5vfhi9_-tvCKcUyXGXdxg_m-EeuPFv';
const WORKER='https://genus-files.anasahas258.workers.dev';
const LIMIT_GB=10; // مساحة Backblaze المجانية

const $=s=>document.querySelector(s);
let sb,me=null,N=[],CNT={},nav={id:null,gen:false,tab:null,v:''},Q='',mode='login',BOX=null;
const TERM_NAMES=['الفصل الأول','الفصل الثاني','الفصل الثالث'];
const TERM_COLORS=['#0e7490','#7c3aed','#c2410c'];
const KIND_AR={country:'دولة',grade:'صف',term:'فصل',subject:'مادة',tab:'تبويب'};

function h(t,c,kids,ev){const e=document.createElement(t);if(c)e.className=c;(Array.isArray(kids)?kids:[kids]).forEach(k=>{if(k!=null&&k!==false)e.append(k.nodeType?k:document.createTextNode(k))});if(ev)Object.assign(e,ev);return e}
const hue=t=>{let n=0;for(const c of t)n=(n*31+c.charCodeAt(0))%360;return`hsl(${n} 45% 38%)`};
const err=e=>alert((e&&e.message)||e);
const dbErr=e=>{if(/kind_check|policy|relation .*visits/i.test((e&&e.message)||''))alert('⚠️ لازم تشغّل كود SQL الجديد في Supabase الأول');else err(e)};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2300)};
const adm=()=>!!(me&&me.is_admin);
const byId=id=>N.find(n=>n.id===id);
const sortN=(a,b)=>(a.pos||0)-(b.pos||0)||a.name.localeCompare(b.name,'ar');
const ch=(p,k)=>N.filter(n=>n.parent===p&&(!k||n.kind===k)).sort(sortN);
const cntOf=id=>(CNT[id]||0)+N.filter(n=>n.parent===id).reduce((s,k)=>s+cntOf(k.id),0);
const chain=id=>{const a=[];let n=byId(id);while(n){a.unshift(n);n=byId(n.parent)}return a};
const pathTxt=id=>chain(id).map(n=>n.name).join(' ‹ ');
const countryOf=id=>chain(id)[0];
const termsFor=c=>c&&/[اإأ]مارات/.test(c.name)?3:2;
const fmtB=b=>b>=1073741824?(b/1073741824).toFixed(2)+' جيجا':b>=1048576?(b/1048576).toFixed(1)+' ميجا':Math.max(1,Math.round((b||0)/1024))+' كيلو';
const ask=(m,v)=>{const x=prompt(m,v||'');return x&&x.trim()?x.trim():null};
const pub=p=>WORKER.replace(/\/$/,'')+'/'+p;
const tokenOf=async()=>(await sb.auth.getSession()).data.session.access_token;
const isoDay=o=>{const d=new Date();d.setDate(d.getDate()+o);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dayName=d=>new Date(d+'T12:00:00').toLocaleDateString('ar-EG',{weekday:'short'});
const mk=()=>{const b=BOX;return x=>b.append(x)};
const head=(t,s,b)=>h('div','top',[h('div','',[h('h1','',t),s?h('p','sub',s):null]),b&&b.length?h('div','btns',b):null]);
const empty=t=>h('div','empty',t);

// ===== التنقل =====
function go(id,gen,tab,v,how='push'){
  nav={id:id||null,gen:!!gen,tab:tab||null,v:v||''};Q='';$('#srch').value='';
  const d=(history.state&&history.state.d)||0;
  if(how==='push')history.pushState({...nav,d:d+1},'');
  else if(how==='replace')history.replaceState({...nav,d},'');
  render();scrollTo(0,0);
}
function back(){
  if(Q.trim()){Q='';$('#srch').value='';render();return}
  if(history.state&&history.state.d>0){history.back();return}
  if(nav.v)return go(null,false,null,'','replace');
  if(nav.tab)return go(nav.id,false,null,'','replace');
  if(nav.gen)return go(nav.id,false,null,'','replace');
  const n=byId(nav.id);go(n?n.parent:null,false,null,'','replace');
}
addEventListener('popstate',e=>{const s=e.state||{};nav={id:s.id||null,gen:!!s.gen,tab:s.tab||null,v:s.v||''};Q='';$('#srch').value='';render();scrollTo(0,0)});

// ===== التخزين =====
const xput=(url,blob,onp,hdr)=>new Promise((ok,no)=>{const x=new XMLHttpRequest();x.open('PUT',url);if(hdr)Object.keys(hdr).forEach(k=>x.setRequestHeader(k,hdr[k]));x.upload.onprogress=e=>{if(onp&&e.lengthComputable)onp(e.loaded/e.total)};x.onload=()=>x.status<300?ok():no(new Error('فشل الرفع ('+x.status+')'));x.onerror=()=>no(new Error('فشل الاتصال'));x.send(blob)});
async function put(path,blob,onp){
  const W=WORKER.replace(/\/$/,'');
  try{const r=await fetch(W+'/_sign?key='+encodeURIComponent(path),{method:'POST',headers:{authorization:'Bearer '+await tokenOf()}});
    if(!r.ok)throw new Error(await r.text());await xput(await r.text(),blob.slice(0,blob.size,''),onp);return{}}
  catch(e1){if(blob.size>95*1048576)return{error:new Error('الملف أكبر من 95 ميجا')};
    try{await xput(W+'/'+path,blob,onp,{authorization:'Bearer '+await tokenOf(),'content-type':blob.type||'application/octet-stream'});return{}}catch(e2){return{error:e2}}}
}
async function rm(ps){const t=await tokenOf();await Promise.all(ps.map(p=>fetch(pub(p),{method:'DELETE',headers:{authorization:'Bearer '+t}}).catch(()=>{})))}
async function loadNodes(){
  const [a,b]=await Promise.all([sb.from('nodes').select('*').limit(5000),sb.from('books').select('node').limit(50000)]);
  N=a.data||[];CNT={};(b.data||[]).forEach(x=>CNT[x.node]=(CNT[x.node]||0)+1);
}

// ===== الحساب =====
async function emailOf(n){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(n.trim().toLowerCase()));return'u'+[...new Uint8Array(d)].slice(0,16).map(b=>b.toString(16).padStart(2,'0')).join('')+'@genus.app'}
async function loadMe(){const{data:{session}}=await sb.auth.getSession();me=null;if(session){const r=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();me=r.data||null}}
function setMode(m){mode=m;$('#tl').classList.toggle('on',m==='login');$('#tr').classList.toggle('on',m==='reg');$('#pw').autocomplete=m==='reg'?'new-password':'current-password';$('#msg').textContent=''}
function authOpen(){setMode('login');$('#dlg').showModal()}
async function submitAuth(){
  const name=$('#un').value.trim(),pw=$('#pw').value,msg=$('#msg');msg.textContent='';
  if(!name)return msg.textContent='اكتب الاسم';
  if(pw.length<6)return msg.textContent='الرقم السري 6 خانات على الأقل';
  $('#go').disabled=true;
  try{const email=await emailOf(name);
    if(mode==='reg'){
      const ex=await sb.from('profiles').select('id').ilike('name',name.replace(/[%_]/g,'\\$&')).maybeSingle();
      if(ex.data)throw new Error('الاسم مستخدم، اختر اسماً آخر');
      const r=await sb.auth.signUp({email,password:pw,options:{data:{name}}});if(r.error)throw r.error;

async function addNode(parent,kind){
  const name=ask('اسم ال'+KIND_AR[kind]+' الجديد:');if(!name)return;
  const sib=N.filter(n=>n.parent===parent&&n.kind===kind);
  const r=await sb.from('nodes').insert({parent,kind,name,pos:Math.max(0,...sib.map(x=>x.pos||0))+1});
  if(r.error)return dbErr(r.error);toast('تمت الإضافة ✓');render();
}
async function renameNode(n){const v=ask('الاسم الجديد:',n.name);if(!v)return;const r=await sb.from('nodes').update({name:v}).eq('id',n.id);if(r.error)return dbErr(r.error);toast('تم التعديل ✓');render()}
async function delNode(n){
  const ids=[n.id],q=[n.id];while(q.length){const p=q.shift();N.filter(x=>x.parent===p).forEach(k=>{ids.push(k.id);q.push(k.id)})}
  const r=await sb.from('books').select('file_path,cover_path').in('node',ids);
  const ps=(r.data||[]).flatMap(b=>[b.file_path,b.cover_path]).filter(Boolean);if(ps.length)await rm(ps);
  const d=await sb.from('nodes').delete().eq('id',n.id);if(d.error)err(d.error);
}
const delAsk=n=>async()=>{if(confirm('حذف «'+n.name+'» وكل ما بداخله من ملفات؟')){await delNode(n);toast('تم الحذف');render()}};
const nodeActs=n=>adm()?[['✎',()=>renameNode(n),'','تعديل الاسم'],...(n.kind==='subject'?[['⇄',()=>moveNode(n),'','نقل']]:[]),['✕',delAsk(n),'d','حذف']]:[];
async function ensureTerms(grade,need){
  const have=ch(grade.id,'term').map(t=>t.name);
  const rows=TERM_NAMES.slice(0,need).map((name,i)=>({parent:grade.id,kind:'term',name,pos:i+1})).filter(r=>!have.includes(r.name));
  if(!rows.length)return null;const r=await sb.from('nodes').insert(rows);return r.error;
}

function pick(o){return new Promise(res=>{
  const d=$('#pk');let cur=o.at||null,done=false;
  const fin=v=>{if(done)return;done=true;d.close();res(v)};
  const draw=()=>{
    const b=$('#pkb');b.replaceChildren();
    const cr=h('div','pkcr',[h('button','','🏠 الرئيسية',{onclick:()=>{cur=null;draw()}})]);
    chain(cur).forEach(n=>cr.append(h('i','','‹'),h('button','',n.name,{onclick:()=>{cur=n.id;draw()}})));b.append(cr);
    const curN=byId(cur);
    if(curN&&o.ok(curN))b.append(h('div','prow cur',[h('span','pk','هنا'),h('b','',curN.kind==='grade'?'عام للصف — '+curN.name:curN.name),h('button','btn p sm','نقل هنا ✓',{onclick:e=>{e.stopPropagation();fin(curN.id)}})]));
    const kids=N.filter(n=>n.parent===cur&&o.kinds.includes(n.kind)).sort(sortN);
    if(!kids.length)b.append(h('p','sub','لا توجد أقسام أخرى هنا'));
    kids.forEach(n=>{
      const sel=o.ok(n),more=N.some(k=>k.parent===n.id&&o.kinds.includes(k.kind));
      const row=h('div','prow',[h('span','pk',KIND_AR[n.kind]),h('b','',n.name)],{onclick:()=>{if(more){cur=n.id;draw()}else if(sel)fin(n.id)}});
      if(sel)row.append(h('button','btn p sm',n.kind==='grade'?'عام للصف':'اختيار',{onclick:e=>{e.stopPropagation();fin(n.id)}}));
      if(more)row.append(h('span','pk','فتح ‹'));
      b.append(row);
    });
  };
  $('#pkt').textContent=o.title;$('#pkx').onclick=()=>fin(null);d.onclose=()=>fin(null);
  draw();d.showModal();
})}

    h('button','btn',`📦 نقل كل المواد غير المصنفة للفصل الأول`,{onclick:async()=>{const ups=[];N.filter(n=>n.kind==='grade').forEach(g=>{const t=ch(g.id,'term')[0];if(t)ch(g.id,'subject').forEach(s=>ups.push([s.id,t.id]))});if(!ups.length)return toast('مفيش مواد غير مصنفة ✓');if(!confirm('نقل '+ups.length+' مادة للفصل الأول في صفوفها؟'))return;for(const [id,p] of ups){const r=await sb.from('nodes').update({parent:p}).eq('id',id);if(r.error)return dbErr(r.error)}toast('تم نقل '+ups.length+' مادة ✓');render()}})
  ])]));
}

// ===== العرض =====
async function render(){
  const box=h('div');BOX=box;
  await loadNodes();if(BOX!==box)return;
  if(nav.id&&!byId(nav.id))nav={id:null,gen:false,tab:null,v:''};
  renderHeader();renderNav();$('#main').replaceChildren(box);
  if(nav.v==='dash'&&adm())return vDash();
  if(Q.trim())return vSearch();
  const n=byId(nav.id);
  if(!n)return vHome();
  if(nav.gen)return vBooks(n);
  if(n.kind==='country')return vCountry(n);
  if(n.kind==='grade')return vGrade(n);
  if(n.kind==='term')return vTerm(n);
  return vBooks(n);
}

// ===== الرفع =====
const PDF='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';let pdfP=null;
function loadPdf(){return pdfP||(pdfP=new Promise((ok,no)=>{if(window.pdfjsLib)return ok(pdfjsLib);const s=document.createElement('script');s.src=PDF+'pdf.min.js';s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc=PDF+'pdf.worker.min.js';ok(pdfjsLib)};s.onerror=()=>{pdfP=null;no(new Error('pdf'))};document.head.append(s)}))}
async function pdfCover(file){const lib=await loadPdf(),pdf=await lib.getDocument({data:await file.arrayBuffer()}).promise,p=await pdf.getPage(1);const w=p.getViewport({scale:1}).width,v=p.getViewport({scale:360/w}),cv=document.createElement('canvas');cv.width=v.width;cv.height=v.height;await p.render({canvasContext:cv.getContext('2d'),viewport:v}).promise;return new Promise(r=>cv.toBlob(r,'image/jpeg',.82))}
async function upload(files){
  if(!me)return authOpen();
  const node=nav.tab||nav.id,btn=document.querySelector('.top .btn.p'),pg=$('#prog');if(pg)pg.hidden=false;
  for(let i=0;i<files.length;i++){const f=files[i];if(btn){btn.disabled=true;btn.textContent=`رفع ${i+1}/${files.length}...`}
    try{const e=(f.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5)||'bin';
      const base=`${me.id}/${Date.now()}-${Math.random().toString(36).slice(2,7)}`,path=base+'.'+e;
      let r=await put(path,f,p=>{if(btn)btn.textContent=`رفع ${i+1}/${files.length} — ${Math.round(p*100)}%`;if(pg)pg.firstChild.style.width=Math.round(p*100)+'%'});if(r.error)throw r.error;
      let cp=null;try{let cb=null;if(f.type.startsWith('image/'))cb=f;else if(/\.pdf$/i.test(f.name)&&f.size<120*1048576)cb=await pdfCover(f);if(cb){cp=base+'-cover.jpg';r=await put(cp,cb);if(r.error)cp=null}}catch(_){cp=null}
      r=await sb.from('books').insert({node,title:f.name,file_path:path,cover_path:cp,size:f.size,uploader:me.id,uploader_name:me.name});if(r.error)throw r.error;
    }catch(x){err(x)}}
  toast('تم الرفع ✓');render();
}

addEventListener('dragover',e=>{if(canDrop())e.preventDefault()});
addEventListener('drop',e=>{if(canDrop()&&e.dataTransfer.files.length){e.preventDefault();upload([...e.dataTransfer.files])}});

  if(!window.supabase){$('#main').append(empty('تعذّر تحميل البرنامج — تأكد من الإنترنت'));return}
  sb=supabase.createClient(SB_URL,SB_KEY);

  await loadMe();render();logVisit();
})();
