<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>genus</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f2f5f6;--card:#fff;--ink:#14232b;--mute:#62757e;--line:#dce4e8;--head:#0c3d3b;--acc:#0f766e;--accink:#fff;--soft:#e1f2ef;--gold:#c8962e;--danger:#b42318;--sh:0 1px 2px rgba(12,40,50,.08),0 6px 18px rgba(12,40,50,.06);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0d181c;--card:#15252b;--ink:#e7f0f2;--mute:#8fa6af;--line:#27404a;--head:#082b2a;--acc:#2dd4bf;--accink:#06201d;--soft:#173a39;--gold:#e0b24a;--danger:#ff8a80;--sh:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif;line-height:1.55;min-height:100vh}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{background:var(--head);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 20px 10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.brand{display:flex;gap:10px;align-items:center;font-weight:800;font-size:1.5rem;letter-spacing:.5px;background:none;border:0;color:#fff;padding:0}
.brand svg{width:30px;height:30px}
#srch{flex:1;min-width:150px;max-width:380px;margin-inline-start:auto;padding:8px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff}
#srch::placeholder{color:rgba(255,255,255,.7)}
.who{display:flex;gap:8px;align-items:center;font-size:.92rem}
.hb{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:9px;padding:5px 12px}
.tag{background:var(--gold);color:#2b2000;border-radius:6px;padding:0 8px;font-size:.75rem;font-weight:800}
.crumb{background:var(--card);border-bottom:1px solid var(--line);padding:8px 20px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.95rem}
.crumb button{background:none;border:0;color:var(--acc);padding:2px 6px;border-radius:6px;font-weight:600}
.crumb .cur{font-weight:800;padding:2px 6px}.crumb i{color:var(--mute);font-style:normal}
main{max-width:1100px;margin:0 auto;padding:22px 20px 48px}
.top{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
h1{margin:0;font-size:1.6rem;font-weight:800}.sub{margin:2px 0 0;color:var(--mute)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 16px;font-weight:600}
.btn.p{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--sh);cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:150px}
.card:hover{border-color:var(--acc)}
.ic{width:46px;height:46px;border-radius:12px;color:#fff;display:grid;place-items:center;font-size:1.4rem;font-weight:800;margin-bottom:4px}
.ct{font-weight:800;font-size:1.08rem}.cm{color:var(--mute);font-size:.9rem}
.acts{position:absolute;top:10px;inset-inline-end:10px;display:flex;gap:4px}
.ib{border:0;background:var(--soft);width:30px;height:30px;border-radius:8px}.ib.d{color:var(--danger)}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:20px}
.book{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column}
.cover{aspect-ratio:3/4;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;border-inline-start:6px solid rgba(0,0,0,.25)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ft{color:#fff;font-weight:800;text-align:center;padding:14px;overflow-wrap:anywhere}
.bi{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.bn{font-weight:600;font-size:.95rem;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bm{color:var(--mute);font-size:.8rem}
.ba{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.ba button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:2px 10px;font-size:.85rem}.ba .d{color:var(--danger)}
.empty{border:2px dashed var(--line);border-radius:14px;padding:44px 16px;text-align:center;color:var(--mute)}
.urow{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.urow b{flex:1}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:22px;width:min(380px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog input{width:100%;padding:10px 12px;margin:6px 0 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1}.tabs .on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
#msg{color:var(--danger);min-height:1.4em;font-size:.9rem;margin:0 0 6px}
</style>
</head>
<body>
<header>
  <button class="brand" id="home"><svg viewBox="0 0 32 32"><rect x="3" y="5" width="12.5" height="22" rx="2" fill="#fff"/><rect x="16.5" y="5" width="12.5" height="22" rx="2" fill="#c8962e"/></svg>genus</button>
  <input id="srch" type="search" placeholder="ابحث عن كتاب بالاسم" aria-label="بحث">
  <div class="who" id="who"></div>
</header>
<nav class="crumb" id="crumb"></nav>
<main id="main"></main>
<input type="file" id="pick" multiple hidden>
<dialog id="dlg">
  <div class="tabs"><button class="btn" id="tl">دخول</button><button class="btn" id="tr">حساب جديد</button></div>
  <label>الاسم<input id="un" autocomplete="username" maxlength="30"></label>
  <label>الرقم السري<input id="pw" type="password" autocomplete="current-password" minlength="6"></label>
  <p id="msg"></p>
  <div style="display:flex;gap:8px"><button class="btn p" id="go" style="flex:1">متابعة</button><button class="btn" id="cx">إلغاء</button></div>
</dialog>
<script>
// ===== ضع بيانات مشروع Supabase هنا (Project Settings > API) =====
const SB_URL='https://slomoffkmwbnrgwvezlh.supabase.co';
const SB_KEY='sb_publishable_Z5vfhi9_-tvCKcUyXGXdxg_m-EeuPFv';
const WORKER='https://genus-files.anasahas258.workers.dev'; // رابط Cloudflare Worker (مساحة 10 جيجا)
// ================================================================
const $=s=>document.querySelector(s);
let sb,me=null,N=[],CNT={},nav={id:null,gen:false},Q='',mode='login';
function h(t,c,kids,ev){const e=document.createElement(t);if(c)e.className=c;(Array.isArray(kids)?kids:[kids]).forEach(k=>{if(k!=null)e.append(k.nodeType?k:document.createTextNode(k))});if(ev)Object.assign(e,ev);return e}
const hue=t=>{let n=0;for(const ch of t)n=(n*31+ch.charCodeAt(0))%360;return `hsl(${n} 42% 36%)`};
const err=e=>alert((e&&e.message)||e);
const adm=()=>!!(me&&me.is_admin);
const byId=id=>N.find(n=>n.id===id);
const kids=p=>N.filter(n=>n.parent===p).sort((a,b)=>a.pos-b.pos||a.name.localeCompare(b.name,'ar'));
const cntOf=id=>(CNT[id]||0)+kids(id).reduce((s,k)=>s+cntOf(k.id),0);
const pub=p=>WORKER.replace(/\/$/,'')+'/'+p;
const tokenOf=async()=>(await sb.auth.getSession()).data.session.access_token;
const xput=(url,blob,onp,hdr)=>new Promise((ok,no)=>{const x=new XMLHttpRequest();x.open('PUT',url);if(hdr)Object.keys(hdr).forEach(k=>x.setRequestHeader(k,hdr[k]));x.upload.onprogress=e=>{if(onp&&e.lengthComputable)onp(e.loaded/e.total)};x.onload=()=>x.status<300?ok():no(new Error('فشل الرفع ('+x.status+')'));x.onerror=()=>no(new Error('فشل الاتصال بالتخزين'));x.send(blob)});
async function put(path,blob,onp){
  const W=WORKER.replace(/\/$/,'');
  try{ // رفع مباشر (يدعم الملفات الكبيرة)
    const r=await fetch(W+'/_sign?key='+encodeURIComponent(path),{method:'POST',headers:{authorization:'Bearer '+await tokenOf()}});
    if(!r.ok)throw new Error(await r.text());
    await xput(await r.text(),blob.slice(0,blob.size,''),onp);return {};
  }catch(e1){
    if(blob.size>95*1048576)return{error:new Error('الملف أكبر من 95 ميجا ويحتاج إعداد CORS في Backblaze')};
    try{await xput(W+'/'+path,blob,onp,{authorization:'Bearer '+await tokenOf(),'content-type':blob.type||'application/octet-stream'});return {}}catch(e2){return{error:e2}}
  }}
async function rm(ps){const t=await tokenOf();await Promise.all(ps.map(p=>fetch(pub(p),{method:'DELETE',headers:{authorization:'Bearer '+t}}).catch(()=>{})))}
const fmt=b=>b>1048576?(b/1048576).toFixed(1)+' ميجا':Math.max(1,Math.round((b||0)/1024))+' كيلو';
const ask=(m,v)=>{const x=prompt(m,v||'');return x&&x.trim()?x.trim():null};
const pathOf=id=>{const a=[];let n=byId(id);while(n){a.unshift(n.name);n=byId(n.parent)}return a};
function go(id,gen){nav={id:id||null,gen:!!gen};Q='';$('#srch').value='';$('#main').dataset.v='';render();scrollTo(0,0)}
async function loadNodes(){const [a,b]=await Promise.all([sb.from('nodes').select('*').limit(3000),sb.from('books').select('node').limit(30000)]);N=a.data||[];CNT={};(b.data||[]).forEach(x=>CNT[x.node]=(CNT[x.node]||0)+1)}
// ===== الحساب =====
async function emailOf(n){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(n.trim().toLowerCase()));return 'u'+[...new Uint8Array(d)].slice(0,16).map(b=>b.toString(16).padStart(2,'0')).join('')+'@genus.app'}
async function loadMe(){const {data:{session}}=await sb.auth.getSession();me=null;if(session){const r=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();me=r.data||null}}
function setMode(m){mode=m;$('#tl').classList.toggle('on',m==='login');$('#tr').classList.toggle('on',m==='reg');$('#pw').autocomplete=m==='reg'?'new-password':'current-password';$('#msg').textContent=''}
function authOpen(){setMode('login');$('#dlg').showModal()}
async function submitAuth(){
  const name=$('#un').value.trim(),pw=$('#pw').value,msg=$('#msg');msg.textContent='';
  if(!name)return msg.textContent='اكتب الاسم';
  if(pw.length<6)return msg.textContent='الرقم السري 6 خانات على الأقل';
  $('#go').disabled=true;
  try{
    const email=await emailOf(name);
    if(mode==='reg'){
      const ex=await sb.from('profiles').select('id').ilike('name',name.replace(/[%_]/g,'\\$&')).maybeSingle();
      if(ex.data)throw new Error('الاسم مستخدم بالفعل، اختر اسماً آخر');
      const r=await sb.auth.signUp({email,password:pw,options:{data:{name}}});
      if(r.error)throw r.error;
      if(!r.data.session)throw new Error('فعّل تسجيل الدخول بدون تأكيد البريد في إعدادات Supabase');
    }else{
      const r=await sb.auth.signInWithPassword({email,password:pw});
      if(r.error)throw new Error('الاسم أو الرقم السري غير صحيح');
    }
    $('#dlg').close();$('#pw').value='';await loadMe();render();
  }catch(e){msg.textContent=e.message||String(e)}
  $('#go').disabled=false}
// ===== العرض =====
function card(t,m,open,ren,del){
  const ic=h('div','ic',t.trim().charAt(0));ic.style.background=hue(t);
  const c=h('div','card',[ic,h('div','ct',t),h('div','cm',m)],{onclick:open,tabIndex:0,onkeydown:e=>{if(e.key==='Enter')open()}});
  if(adm()&&(ren||del)){const a=h('div','acts');
    if(ren)a.append(h('button','ib','✎',{title:'تعديل الاسم',onclick:e=>{e.stopPropagation();ren()}}));
    if(del)a.append(h('button','ib d','✕',{title:'حذف',onclick:e=>{e.stopPropagation();del()}}));c.append(a)}
  return c}
const head=(t,s,b)=>h('div','top',[h('div','',[h('h1','',t),h('p','sub',s)]),h('div','',b||[])]);
const empty=t=>h('div','empty',t);
function header(){
  const w=$('#who');w.replaceChildren();
  if(me){w.append(h('span','',me.name));if(adm()){w.append(h('span','tag','أدمن'),h('button','hb','المستخدمون',{onclick:()=>{Q='';nav={id:null,gen:false};$('#main').dataset.v='users';render()}}))}
    w.append(h('button','hb','خروج',{onclick:async()=>{await sb.auth.signOut();me=null;go(nav.id,nav.gen)}}))}
  else w.append(h('button','hb','دخول / حساب جديد',{onclick:authOpen}))}
function crumb(){
  const cr=$('#crumb');cr.replaceChildren();const it=[['الرئيسية',()=>go()]];
  const v=$('#main').dataset.v;
  if(v==='users')it.push(['المستخدمون',null]);
  else{const ids=[];let n=byId(nav.id);while(n){ids.unshift(n);n=byId(n.parent)}
    ids.forEach((n,i)=>it.push([n.name,(i===ids.length-1&&!nav.gen)?null:()=>go(n.id)]));
    if(nav.gen)it.push(['عام للصف',null]);if(Q.trim())it.push(['نتائج البحث',null])}
  it.forEach((x,i)=>{if(i)cr.append(h('i','','‹'));cr.append(i===it.length-1?h('span','cur',x[0]):h('button','',x[0],{onclick:x[1]}))})}
async function delNodes(n){ // يحذف الملفات من التخزين ثم العقدة
  const ids=[n.id],q=[n.id];while(q.length){const c=kids(q.shift());c.forEach(k=>{ids.push(k.id);q.push(k.id)})}
  const r=await sb.from('books').select('file_path,cover_path').in('node',ids);
  const ps=(r.data||[]).flatMap(b=>[b.file_path,b.cover_path]).filter(Boolean);
  if(ps.length)await rm(ps);
  const d=await sb.from('nodes').delete().eq('id',n.id);if(d.error)err(d.error)}
function vNodes(){
  const cur=byId(nav.id),list=kids(nav.id),ak=!cur?['country','دولة']:cur.kind==='country'?['grade','صف']:['subject','مادة'];
  const add=adm()?[h('button','btn p','+ إضافة '+ak[1],{onclick:async()=>{const n=ask('اسم ال'+ak[1]+':');if(!n)return;const r=await sb.from('nodes').insert({parent:nav.id,kind:ak[0],name:n,pos:Math.max(0,...list.map(x=>x.pos))+1});if(r.error)return err(r.error);render()}})]:[];
  $('#main').append(head(cur?cur.name:'الدول',cur?pathOf(cur.parent).join(' ‹ '):'اختر دولة لعرض صفوفها الدراسية',add));
  const g=h('div','grid');
  if(cur&&cur.kind==='grade')g.append(card('عام للصف',(CNT[cur.id]||0)+' كتاب',()=>go(cur.id,true)));
  list.forEach(n=>{const k=kids(n.id).length;
    const meta=n.kind==='subject'?cntOf(n.id)+' كتاب':(n.kind==='country'?k+' صف · ':k+' مادة · ')+cntOf(n.id)+' كتاب';
    g.append(card(n.name,meta,()=>go(n.id),async()=>{const v=ask('الاسم الجديد:',n.name);if(v){const r=await sb.from('nodes').update({name:v}).eq('id',n.id);if(r.error)return err(r.error);render()}},
      async()=>{if(confirm('حذف «'+n.name+'» وكل ما بداخله من كتب؟')){await delNodes(n);render()}}))});
  $('#main').append(list.length||(cur&&cur.kind==='grade')?g:empty('لا يوجد شيء هنا بعد.'))}
function bookCard(b,path){
  const cv=h('div','cover',null,{onclick:()=>open(pub(b.file_path)),title:'فتح الكتاب'});
  if(b.cover_path)cv.append(h('img','',null,{src:pub(b.cover_path),alt:b.title,loading:'lazy'}));
  else{cv.style.background=hue(b.title);cv.append(h('div','ft',b.title.replace(/\.[^.]+$/,'')))}
  const a=h('div','ba',[h('button','','فتح',{onclick:()=>open(pub(b.file_path))}),
    h('button','','تحميل',{onclick:async()=>{try{const r=await fetch(pub(b.file_path)),u=URL.createObjectURL(await r.blob());h('a','',null,{href:u,download:b.title}).click();setTimeout(()=>URL.revokeObjectURL(u),5000)}catch(e){open(pub(b.file_path))}}})]);
  if(adm())a.append(h('button','d','حذف',{onclick:async()=>{if(!confirm('حذف هذا الكتاب؟'))return;await rm([b.file_path,b.cover_path].filter(Boolean));const r=await sb.from('books').delete().eq('id',b.id);if(r.error)return err(r.error);render()}}));
  return h('div','book',[cv,h('div','bi',[h('div','bn',b.title),h('div','bm',(path?path.join(' ‹ ')+' · ':'')+fmt(b.size)+' · '+(b.uploader_name||'')),a])])}
async function vBooks(){
  const n=byId(nav.id);
  const btn=h('button','btn p','+ إضافة كتاب',{onclick:()=>me?$('#pick').click():authOpen()});
  $('#main').append(head(nav.gen?'كتب عامة للصف':n.name,pathOf(nav.gen?n.id:n.parent).join(' ‹ '),[btn]));
  const r=await sb.from('books').select('*').eq('node',nav.id).order('created_at',{ascending:false});
  if(r.error)return $('#main').append(empty('تعذّر تحميل الكتب.'));
  if(!r.data.length)return $('#main').append(empty(me?'لا توجد كتب هنا بعد. أضف أول كتاب.':'لا توجد كتب هنا بعد. سجّل الدخول لإضافة كتاب.'));
  const g=h('div','books');r.data.forEach(b=>g.append(bookCard(b)));$('#main').append(g)}
async function vSearch(){
  const t=Q.trim().replace(/[%_]/g,'\\$&');
  const r=await sb.from('books').select('*').ilike('title','%'+t+'%').order('created_at',{ascending:false}).limit(60);
  const d=r.data||[];$('#main').append(head('نتائج البحث',d.length+' كتاب'));
  if(!d.length)return $('#main').append(empty('لا توجد كتب بهذا الاسم.'));
  const g=h('div','books');d.forEach(b=>g.append(bookCard(b,pathOf(b.node))));$('#main').append(g)}
async function vUsers(){
  const r=await sb.from('profiles').select('*').order('created_at');
  $('#main').append(head('المستخدمون',(r.data||[]).length+' حساب'));
  (r.data||[]).forEach(u=>{const row=h('div','urow',[h('b','',u.name),u.is_admin?h('span','tag','أدمن'):null]);
    if(u.id!==me.id)row.append(h('button','btn','حذف الحساب',{onclick:async()=>{if(!confirm('حذف حساب «'+u.name+'»؟ كتبه تبقى كما هي.'))return;const x=await sb.rpc('admin_delete_user',{uid:u.id});if(x.error)return err(x.error);render()}}));
    $('#main').append(row)})}
async function render(){
  const m=$('#main');m.replaceChildren();
  await loadNodes();
  if(nav.id&&!byId(nav.id))nav={id:null,gen:false};
  const v=m.dataset.v;header();crumb();
  if(v==='users'&&adm())return vUsers();
  if(Q.trim())return vSearch();
  const n=byId(nav.id);
  if(n&&(n.kind==='subject'||nav.gen))return vBooks();
  vNodes()}
// ===== الرفع =====
const PDF='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';let pdfP=null;
function loadPdf(){return pdfP||(pdfP=new Promise((ok,no)=>{if(window.pdfjsLib)return ok(pdfjsLib);const s=document.createElement('script');s.src=PDF+'pdf.min.js';s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc=PDF+'pdf.worker.min.js';ok(pdfjsLib)};s.onerror=()=>{pdfP=null;no(new Error('pdf'))};document.head.append(s)}))}
async function pdfCover(file){const lib=await loadPdf(),pdf=await lib.getDocument({data:await file.arrayBuffer()}).promise,p=await pdf.getPage(1);
  const w=p.getViewport({scale:1}).width,v=p.getViewport({scale:360/w}),cv=document.createElement('canvas');cv.width=v.width;cv.height=v.height;
  await p.render({canvasContext:cv.getContext('2d'),viewport:v}).promise;return new Promise(r=>cv.toBlob(r,'image/jpeg',.82))}
async function upload(files){
  if(!me)return authOpen();const node=nav.id,btn=document.querySelector('.top .btn.p');
  for(let i=0;i<files.length;i++){const f=files[i];if(btn){btn.disabled=true;btn.textContent=`جاري رفع ${i+1} من ${files.length}...`}
    try{
      const e=(f.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5)||'bin';
      const base=`${me.id}/${Date.now()}-${Math.random().toString(36).slice(2,7)}`,path=base+'.'+e;
      let r=await put(path,f,p=>{if(btn)btn.textContent=`جاري رفع ${i+1} من ${files.length} — ${Math.round(p*100)}%`});if(r.error)throw r.error;
      let cp=null;
      try{let cb=null;if(f.type.startsWith('image/'))cb=f;else if(/\.pdf$/i.test(f.name)&&f.size<120*1048576)cb=await pdfCover(f);
        if(cb){cp=base+'-cover.jpg';r=await put(cp,cb);if(r.error)cp=null}}catch(_){cp=null}
      r=await sb.from('books').insert({node,title:f.name,file_path:path,cover_path:cp,size:f.size,uploader:me.id,uploader_name:me.name});if(r.error)throw r.error;
    }catch(x){err(x)}}
  render()}

addEventListener('drop',e=>{const n=byId(nav.id);if(n&&(n.kind==='subject'||nav.gen)&&e.dataTransfer.files.length){e.preventDefault();upload([...e.dataTransfer.files])}});
